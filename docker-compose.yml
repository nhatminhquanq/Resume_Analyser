# ==========================================================
# Docker Compose - Resume Analyser (Full Stack + Database)
# Tích hợp trọn gói MongoDB (có sẵn dữ liệu) + Backend + Frontend
# ==========================================================

services:


  # --- Backend (Spring Boot API) ---
  backend:
    image: ${BACKEND_IMAGE:-nhatminhquanq/resume-backend}:${VERSION:-latest}
    container_name: resume-backend
    ports:
      - "8081:8080"
    environment:
      # Kết nối trực tiếp tới container mongodb bên trên
      - SPRING_MONGODB_URI=mongodb://mongodb:27017/cv_screening
    depends_on:
      - mongodb
    networks:
      - resume-network
    restart: always

  # --- Frontend (React + Nginx) ---
  frontend:
    image: ${FRONTEND_IMAGE:-nhatminhquanq/resume-frontend}:${VERSION:-latest}
    container_name: resume-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - resume-network
    restart: always

# Volume lưu trữ dữ liệu database
volumes:
  mongo-data:

# Network kết nối 3 container
networks:
  resume-network:
    name: resume-network
    external: true