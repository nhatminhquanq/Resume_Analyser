#(Lưu ý nhỏ trước khi bấm Build Now: Đảm bảo trong PowerShell bạn đã chạy docker network create resume-network để bước 6 Deploy bật cả Backend, Frontend, Prometheus và Grafana lên không bị vướng lỗi thiếu network).# ==========================================================
# Docker Compose - Resume Analyser (Backend + Frontend)
# Kết nối tới MongoDB đã chạy sẵn trên máy
# ==========================================================

services:

  # Backend (Spring Boot API)
  backend:
    image: ${BACKEND_IMAGE:-nhatminhquanq/resume-backend}:${VERSION:-latest}
    container_name: resume-backend
    ports:
      - "8081:8080"
    environment:
      # Nếu MongoDB chạy trong cùng network 'resume-network' với tên 'mongodb' hoặc 'resume-mongodb',
      # hoặc chạy ngoài máy thật qua 'host.docker.internal'
      - SPRING_MONGODB_URI=mongodb://host.docker.internal:27017/cv_screening
      - SPRING_DATA_MONGODB_URI=mongodb://host.docker.internal:27017/cv_screening
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - resume-network
    restart: always

  # Frontend (React + Nginx)
  frontend:
    image: ${FRONTEND_IMAGE:-nhatminhquanq/resume-frontend}:${VERSION:-latest}
    container_name: resume-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - resume-network
    restart: always

  # Prometheus (Monitoring)
  prometheus:
    build:
      context: ./monitoring
    image: resume-prometheus:latest
    container_name: resume-prometheus
    ports:
      - "9090:9090"
    depends_on:
      - backend
    networks:
      - resume-network
    restart: always

  # Grafana (Monitoring Dashboard)
  grafana:
    image: grafana/grafana:latest
    container_name: resume-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - resume-network
    restart: always

# Network kết nối các container
networks:
  resume-network:
    name: resume-network
    external: true

volumes:
  grafana-data: