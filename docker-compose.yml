# ==========================================================
# Docker Compose - Resume Analyser (Backend + Frontend)
# Kết nối tới MongoDB đã chạy sẵn trên máy
# ==========================================================

services:

  # --- Backend (Spring Boot API) ---
  backend:
    image: ${BACKEND_IMAGE:-nhatminhquanq/resume-backend}:${VERSION:-latest}
    container_name: resume-backend
    ports:
      - "8081:8080"
    environment:
      # Nếu MongoDB chạy trong cùng network 'resume-network' với tên 'mongodb' hoặc 'resume-mongodb',
      # hoặc chạy ngoài máy thật qua 'host.docker.internal'
      - SPRING_MONGODB_URI=mongodb://host.docker.internal:27017/cv_screening
      - SPRING_DATA_MONGODB_URI=mongodb://host.docker.internal:27017/cv_screening
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - resume-network
    restart: always

  # --- Frontend (React + Nginx) ---
  frontend:
    image: ${FRONTEND_IMAGE:-nhatminhquanq/resume-frontend}:${VERSION:-latest}
    container_name: resume-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - resume-network
    restart: always

# Network kết nối các container
networks:
  resume-network:
    name: resume-network
    external: true
